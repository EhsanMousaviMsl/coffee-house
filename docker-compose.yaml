services:
  postgres:
    image: postgres:17
    container_name: coffee-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: coffee-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-react/src:/app/src
    environment:
      - VITE_API_BASE_URL=http://host.docker.internal:8000
    depends_on:
      - postgres

volumes:
  postgres_data: